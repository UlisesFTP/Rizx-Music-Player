# THIS FILE IS PUBLIC (tracked in git). Never put RIZX_* configuration, keys, client ids or any
# credential here — the build reads those from ~/.gradle/gradle.properties or the environment,
# both of which stay outside the repository. See docs/BUILD.md.

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Gradle Managed Devices (the :baselineprofile module) boot headless, and on this Windows host the
# default 'auto-no-window' GPU mode is rejected by the emulator, which then exits before the snapshot
# can be taken. Software rendering boots reliably; the profile run only needs the UI to *work*, not to
# be fast, so there is no downside.
android.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
