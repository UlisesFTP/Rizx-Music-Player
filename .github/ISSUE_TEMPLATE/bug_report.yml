name: Bug report
description: Something in the app does not work as documented.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. A reproducible report with a `logcat` excerpt is usually fixed
        within a release. Please check the [user guide](../blob/main/docs/USER_GUIDE.md) first — a
        few behaviours that look like bugs are documented limits (offline sources, provider outages).
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings › App › About Rizx (for example `1.0.0 (3)`), or the release tag you installed.
      placeholder: "1.0.0 (3)"
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version and device
      placeholder: "Android 14, Pixel 7a"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Playback / audio
        - Search / browse / Home feed
        - Lyrics
        - Equalizer / 8D / audio effects
        - Library / playlists / imports
        - Downloads / offline / local music
        - Account / sync / share links
        - Audio ID (recognition)
        - Widgets
        - Plugins
        - In-app updates
        - Settings / UI / translations
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Tap …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        `adb logcat -d | grep -i rizx` right after the problem, or a screenshot. Remove anything
        personal; the app never logs credentials or stream URLs, but a log can name songs you played.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
        - label: This is not a security problem (those go through SECURITY.md).
          required: true
